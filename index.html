<head>
<meta charset="UTF-8">

<title>Việt Xiaomi Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap">
<style>
:root {
    color-scheme: dark;
    --bg: #0e0c10;
    --surface: #1c1920;
    --surface-hi: #2a2530;
    --ink: #fff9f4;
    --muted: #bdb3bb;
    --orange: #ffad75;
    --gutter: clamp(14px, 3.4vw, 64px);
    --left: max(var(--gutter), env(safe-area-inset-left));
    --right: max(var(--gutter), env(safe-area-inset-right));
    --glass-alpha: .38;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 600px at 85% -10%, #4a2316 0%, transparent 60%), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font: 16px/1.45 "Google Sans", "Segoe UI", Arial, sans-serif;
}
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
* { -webkit-tap-highlight-color: transparent; }
/* Capsule-following orange focus ring (box-shadow follows border-radius, outline does not on old TV WebViews) */
.glass:focus, .contact:focus, .app-tile:focus,
.glass:hover, .contact:hover, .app-tile:hover {
    outline: none;
    box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--orange), 0 0 18px 4px #ff8a3d66;
}
.glass:focus, .glass:hover { --glass-alpha: .6; transform: scale(1.06); }
.contact:focus, .contact:hover { background: #ffffff26; transform: scale(1.03); }
.app-tile:focus, .app-tile:hover { background: var(--surface-hi); transform: scale(1.04); }

/* ---------- Liquid Glass (controls only) ---------- */
.glass {
    position: relative; isolation: isolate;
    border: 0; color: var(--ink); font: inherit; cursor: pointer;
    border-radius: 999px;
    background: rgba(34, 28, 38, .94);
    box-shadow: inset 0 1px 0 #ffffff5c, inset 0 -1px 0 #ffffff1c, 0 8px 26px #0000008c;
    transition: background-color .25s, transform .15s;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass {
        background: rgba(34, 28, 38, var(--glass-alpha));
        -webkit-backdrop-filter: blur(24px) saturate(190%);
        backdrop-filter: blur(24px) saturate(190%);
    }
    .glass::before {
        content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
        background: radial-gradient(120% 100% at 50% -35%, #ffffff3d, transparent 55%),
                    radial-gradient(90% 70% at 50% 140%, #ffffff17, transparent 60%);
    }
    .glass::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
        background: linear-gradient(155deg, #ffffff8c, #ffffff12 35%, #ffffff05 65%, #ffffff47);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
    }
}
.glass:hover { --glass-alpha: .5; }
.glass:active { transform: scale(.96); }
.scrolled .glass { --glass-alpha: .66; }   /* adaptive tint over content */

/* ---------- Header ---------- */
.toolbar {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;
    padding: max(12px, env(safe-area-inset-top)) var(--right) 12px var(--left);
    pointer-events: none;
}
.toolbar > * { pointer-events: auto; }
/* Scrim behind the floating bar so the logo/title stay legible over scrolled content */
.toolbar::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -28px; z-index: -1; pointer-events: none;
    background: linear-gradient(#0e0c10 0%, #0e0c10f2 55%, #0e0c1000 100%);
    opacity: 0; transition: opacity .25s;
}
.scrolled .toolbar::before { opacity: 1; }
.brand {
    display: flex; align-items: center; gap: 10px; justify-self: start;
    font-weight: 700; font-size: clamp(1.05rem, 1.6vw, 1.4rem); white-space: nowrap;
    text-shadow: 0 2px 10px #000c;
}
.brand svg { width: clamp(38px, 3.4vw, 50px); height: auto; flex: none; }
.brand strong { color: var(--orange); }
.brand-text { display: grid; line-height: 1.15; }
.tagline { display: none; font-size: .72em; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.store-title {
    margin: 0; text-align: center; white-space: nowrap;
    font-weight: 700; font-size: clamp(.95rem, 1.7vw, 1.6rem); letter-spacing: .06em; text-transform: uppercase;
    text-shadow: 0 2px 12px #000d;
}
.store-title span { color: var(--orange); }
.actions { display: flex; gap: 10px; justify-self: end; align-items: center; }
.action {
    display: flex; align-items: center; gap: 8px;
    padding: 11px clamp(16px, 1.6vw, 26px); font-weight: 700; font-size: clamp(.9rem, 1.1vw, 1.05rem);
}
.action svg { width: 20px; height: 20px; }
.action-support { color: #ffd2b1; }
.fullscreen { flex: none; width: 48px; height: 48px; display: grid; place-items: center; }

/* ---------- Content (opaque) ---------- */
.layout { padding: 8px var(--right) max(48px, env(safe-area-inset-bottom)) var(--left); }
.category-section { margin-bottom: clamp(28px, 3.4vw, 52px); scroll-margin-top: 90px; }
.category-title { margin: 0 0 16px; font-size: clamp(1.3rem, 2.1vw, 2rem); display: flex; align-items: center; gap: 12px; }
.cat-ico { width: 1.7em; height: 1.7em; border-radius: 28%; display: grid; place-items: center; flex: none; box-shadow: inset 0 1px 0 #ffffff55, 0 4px 12px #0007; }
.cat-ico svg { width: 62%; height: 62%; }
.grid {
    display: grid; gap: clamp(12px, 1.4vw, 24px);
    grid-template-columns: repeat(3, minmax(0, 1fr));
}
.app-tile {
    min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
    column-gap: clamp(14px, 1.6vw, 28px); row-gap: 4px; text-align: left;
    min-height: clamp(130px, 13vw, 210px);
    padding: clamp(16px, 1.6vw, 28px);
    border-radius: clamp(22px, 2vw, 32px);
    background: var(--surface);
    transition: background-color .2s, transform .2s, box-shadow .2s;
    scroll-margin: 100px 0 40px;
}
.app-tile:hover { background: var(--surface-hi); }
.app-tile > .app-icon { grid-row: 1 / span 3; }
.app-tile > span { grid-column: 2; }
.app-icon {
    width: clamp(88px, 9vw, 160px); height: clamp(88px, 9vw, 160px); border-radius: 24%;
    object-fit: contain; background: #151217; box-shadow: 0 10px 24px #0008;
}
.title-app { font-weight: 700; font-size: clamp(1.05rem, 1.6vw, 1.6rem); line-height: 1.25; overflow-wrap: anywhere; }
.download-count { color: var(--muted); font-size: clamp(.82rem, 1vw, 1rem); }
.dl-hint { font-size: clamp(.82rem, 1vw, 1rem); font-weight: 700; color: var(--orange); opacity: .85; }

/* ---------- Dialogs (floating glass panels) ---------- */
dialog {
    border: 0; padding: 0; background: transparent; color: var(--ink);
    max-width: min(420px, calc(100vw - 32px)); width: 100%;
}
dialog::backdrop { background: #0009; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.panel { border-radius: 34px; padding: 22px 26px; display: grid; gap: 12px; max-height: 92vh; overflow: auto; text-align: center; --glass-alpha: .72; cursor: default; }
.panel h2 { margin: 0; font-size: 1.3rem; }
.panel p { margin: 0; color: var(--muted); font-size: .92rem; }
.qr {
    width: 260px; height: 260px; max-width: 70vw; max-height: 70vw; max-height: 45vh; max-width: 45vh; margin: 0 auto; border-radius: 22px;
    background: #fff; padding: 12px; display: grid; place-items: center; color: #333; font-size: .85rem;
}
.qr img { width: 100%; height: 100%; object-fit: contain; }
.contact-list { display: grid; gap: 10px; }
.contact {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 12px 16px; border-radius: 20px; background: #ffffff12;
}
.contact:hover { background: #ffffff24; }
.contact { transition: transform .2s, background-color .2s; }
.contact b { display: block; }
.contact span { color: var(--muted); font-size: .88rem; }
.brand-ico { width: 44px; height: 44px; flex: none; }
.close { padding: 12px; font-weight: 700; }

.download-toast {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: max(20px, env(safe-area-inset-bottom));
    padding: 13px 24px; font-weight: 600; max-width: calc(100% - 32px); --glass-alpha: .72; cursor: default;
}

@media (max-width: 1100px) {
    .toolbar { grid-template-columns: auto minmax(0, 1fr); }
    .store-title { display: none; }
    .tagline { display: block; }
    .brand { font-size: 1.45rem; gap: 12px; }
    .brand svg { width: 52px; }
    .tagline { font-size: .6em; margin-top: 2px; }
}
@media (max-width: 1000px) and (min-width: 701px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
    .toolbar { grid-template-columns: minmax(0, 1fr); position: relative; }
    .brand { justify-self: start; }
    .actions { grid-row: 2; grid-column: 1 / -1; justify-self: stretch; justify-content: center; }
    .action { flex: 1; justify-content: center; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .app-tile { min-height: 0; }
}
@media (prefers-reduced-transparency: reduce) {
    .glass { background: #262129 !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    .glass::before, .glass::after { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
    .app-tile:focus, .glass:focus, .contact:focus, .glass:active { transform: none; }
}
@media (forced-colors: active) {
    .glass, .app-tile { border: 1px solid ButtonText; }
    :focus-visible { outline-color: Highlight; }
}
</style>

    var catalog = document.getElementById('catalog');
    var toast = document.getElementById('download-toast');
    var toastTimer;
    var entries = [];

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

    function makeTile(app) {
        var url = new URL(app[2], location.href);
        var file = decodeURIComponent(url.pathname.split('/').pop());
        var key = file.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        var a = el('a', 'app-tile');
        a.href = url.href; a.setAttribute('download', file);
        a.setAttribute('aria-label', 'Tải về ' + app[0]);
        var img = el('img', 'app-icon'); img.src = 'icons/' + app[1] + '.png'; img.alt = ''; img.loading = 'lazy';
        var count = el('span', 'download-count', 'Đang tải số lượt...');
        a.append(img, el('span', 'title-app', app[0]), count, el('span', 'dl-hint', '⬇ Bấm để tải'));
        return { a: a, key: key, url: url.href, file: file, name: app[0], icon: app[1], count: count, n: 0 };
    }

    function section(id, title) {
        var s = el('section', 'category-section'); s.id = id;
        var h = el('h2', 'category-title'), ic = CAT_ICONS[id];
        h.innerHTML = '<span class="cat-ico" style="background:' + ic[0] + '"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ic[1] + '</svg></span>';
        h.append(title);
        s.append(h);
        var g = el('div', 'grid'); s.append(g);
        catalog.append(s);
        return g;
    }

    CATS.forEach(function (cat) {
        var grid = section(cat[0], cat[1]);
        cat[2].forEach(function (app) {
            var t = makeTile(app); entries.push(t); grid.append(t.a); bind(t, t.count, t.a);
        });
    });

    function bind(entry, countEl, tile) {
        tile.addEventListener('click', function (ev) {
            ev.preventDefault();
            var d = document.createElement('a'); d.href = entry.url; d.download = entry.file;
            document.body.append(d); d.click(); d.remove();
            toast.textContent = 'Đang tải ' + entry.name + '…';
            toast.hidden = false; clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.hidden = true; }, 4000);

            var sk = 'ximaotv-download:' + entry.key;
            if (Date.now() - Number(store.get(sk) || 0) < DEDUPE_TIME) return;
            fetchT(API + '/' + entry.key, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ visitorId: visitorId }) })
                .then(function (r) { if (!r.ok) throw 0; return r.json(); })
                .then(function (data) {
                    countEl.textContent = fmt.format(Number(data && data.count) || 0) + ' lượt tải';
                    store.set(sk, String(Date.now()));
                }).catch(function () {});
        });
    }

    fetchT(API, {}).then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (data) {
            var counts = (data && data.counts) || {};
            entries.forEach(function (e) { e.n = Number(counts[e.key]) || 0; e.count.textContent = fmt.format(e.n) + ' lượt tải'; });
            var hot = entries.filter(function (e) { return e.n > 0; }).sort(function (a, b) { return b.n - a.n; }).slice(0, HOT_COUNT);
            if (!hot.length) return;
            var grid = section('cat-hot', 'Ứng Dụng Hot');
            catalog.prepend(grid.parentNode);
            hot.forEach(function (e) {
                var t = makeTile([e.name, e.icon, e.url]);
                t.count.textContent = e.count.textContent; grid.append(t.a); bind(e, t.count, t.a);
            });
        })
        .catch(function () { entries.forEach(function (e) { e.count.textContent = 'Chưa có dữ liệu lượt tải'; }); });

    function fetchT(url, opts) {
        if (typeof AbortController === 'undefined') return fetch(url, opts);
        var c = new AbortController(), t = setTimeout(function () { c.abort(); }, REQUEST_TIMEOUT);
        opts.signal = c.signal;
        return fetch(url, opts).then(function (r) { clearTimeout(t); return r; },
                                     function (e) { clearTimeout(t); throw e; });
    }
    function uuid() {
        if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
        });
    }

    /* D-pad / arrow navigation between tiles (TV remote) */
    document.addEventListener('keydown', function (ev) {
        var cur = ev.target.closest && ev.target.closest('.app-tile');
        var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
        if (!cur || !dir || document.querySelector('dialog[open]')) return;
        var o = cur.getBoundingClientRect(), best = null, bestScore = Infinity;
        document.querySelectorAll('.app-tile').forEach(function (c) {
            if (c === cur) return;
            var r = c.getBoundingClientRect();
            var dx = (r.left + r.right - o.left - o.right) / 2, dy = (r.top + r.bottom - o.top - o.bottom) / 2;
            var p = dx * dir[0] + dy * dir[1], cross = Math.abs(dx * dir[1] + dy * dir[0]);
            if (p <= 8 || (dir[0] && cross > o.height / 2)) return;
            var s = p + cross * 2; if (s < bestScore) { best = c; bestScore = s; }
        });
        if (!best && dir[1] === -1) best = document.querySelector('.action');
        if (best) { ev.preventDefault(); best.focus(); best.scrollIntoView({ block: 'nearest' }); }
    });

    /* Dialogs */
    document.querySelectorAll('[data-open]').forEach(function (b) {
        b.addEventListener('click', function () { document.getElementById(b.dataset.open).showModal(); });
    });
    document.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', function () { b.closest('dialog').close(); });
    });
    document.querySelectorAll('dialog').forEach(function (d) {
        d.addEventListener('click', function (ev) { if (ev.target === d) d.close(); });
    });

    /* Adaptive glass tint */
    function onScroll() { document.body.classList.toggle('scrolled', window.scrollY > 8); }
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

    /* Fullscreen */
    var fs = document.getElementById('fullscreen'), root = document.documentElement;
    if (document.fullscreenEnabled && root.requestFullscreen) {
        fs.hidden = false;
        fs.addEventListener('click', function () {
            (document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen()).catch(function () {});
        });
    }

    var first = catalog.querySelector('.app-tile'); if (first) first.focus({ preventScroll: true });
})();
</script>
</body>
</html>
